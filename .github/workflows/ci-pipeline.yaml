# This workflow will build and test a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Continous integration pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  buildAndTest:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      id: setupDotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.2xx'

    - name: Install Android workload
      shell: pwsh
      run: |
        dotnet workload install android --skip-manifest-update
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Failed to install Android workload"
          exit 1
        }

    - name: Build
      id: build
      run: dotnet build Yaref92.Events.ci.slnf
    - name: Test
      run: dotnet test Yaref92.Events.ci.slnf --logger "trx" --no-build --verbosity normal
    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: ${{steps.build.outcome == 'success'}}
      with:
        files: |
          tests/**/TestResults/*.xml
          tests/**/TestResults/*.trx
          tests/**/TestResults/*.json
