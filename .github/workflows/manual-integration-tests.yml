name: Manual network-sensitive integration tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: Run manual TCP integration tests
    uses: yaron-E92/AutoDev/.github/workflows/profile-dotnet.yml@296eddb54f01168a798eafe1bcc81a02e8330242
    with:
      ref: ${{ github.sha }}
      global_json_file: global.json
      setup_command: dotnet workload install android --skip-manifest-update
      restore_command: dotnet restore Yaref92.Events.ci.slnf
      build_command: dotnet build Yaref92.Events.ci.slnf --configuration Release --no-restore
      test_command: dotnet test tests/Yaref92.Events.IntegrationTests --configuration Release --no-build --no-restore --filter TestCategory=Integration --logger "trx;LogFileName=integration.trx" --results-directory artifacts/test-results/manual-integration
      test_results_path: artifacts/test-results/manual-integration/*.trx
      artifact_name: events-manual-integration-results
    permissions:
      contents: read
